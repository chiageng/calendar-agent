[project]
name = "outlook-calendar-agent"
version = "0.3.0"
description = "Local CLI agent for Google Calendar (or Outlook via Microsoft Graph) with a draft + explicit-yes confirmation gate"
readme = "README.md"
authors = [
    { name = "chiageng", email = "chiageng12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "msal>=1.39.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
outlook-calendar = "outlook_calendar_agent.cli:main"
outlook-calendar-agent = "outlook_calendar_agent.cli:main"
calendar-agent-mcp = "outlook_calendar_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
